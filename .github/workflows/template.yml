name: template

# Proves the template still produces a working service after renaming. Only
# meaningful in go-service-template itself; scripts/rename.sh deletes this
# workflow from generated repositories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Rename and verify
        run: scripts/test-rename.sh
