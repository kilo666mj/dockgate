---
- name: Deploy dockgate
  hosts: dockgate
  become: true

  tasks:
    - name: Check required settings
      ansible.builtin.assert:
        that:
          - dockgate_agent_hosts | length > 0
          - not dockgate_fleetglass_url or dockgate_fleetglass_token
        fail_msg: >-
          Set dockgate_agent_hosts (names agents use to reach the server) and,
          when dockgate_fleetglass_url is set, dockgate_fleetglass_token.

    - name: Record the commit being deployed
      ansible.builtin.command:
        cmd: git describe --tags --always --dirty
        chdir: "{{ playbook_dir }}/.."
      register: dockgate_git_version
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Build dockgate locally
      ansible.builtin.command:
        cmd: >-
          go build -trimpath
          -ldflags "-s -w -X main.version={{ dockgate_git_version.stdout }}"
          -o {{ playbook_dir }}/../dockgate-{{ dockgate_goos }}-{{ dockgate_goarch }} .
        chdir: "{{ playbook_dir }}/.."
      environment:
        CGO_ENABLED: "0"
        GOOS: "{{ dockgate_goos }}"
        GOARCH: "{{ dockgate_goarch }}"
        GOTOOLCHAIN: "{{ dockgate_go_toolchain }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Create group
      ansible.builtin.group:
        name: "{{ dockgate_group }}"
        system: true

    - name: Create user
      ansible.builtin.user:
        name: "{{ dockgate_user }}"
        group: "{{ dockgate_group }}"
        home: "{{ dockgate_data_dir }}"
        create_home: false
        system: true
        shell: /usr/sbin/nologin

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ dockgate_data_dir }}"
        state: directory
        owner: "{{ dockgate_user }}"
        group: "{{ dockgate_group }}"
        mode: "0750"

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ dockgate_config_dir }}"
        state: directory
        owner: root
        group: "{{ dockgate_group }}"
        mode: "0750"

    - name: Install binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dockgate-{{ dockgate_goos }}-{{ dockgate_goarch }}"
        dest: "{{ dockgate_binary }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart dockgate

    - name: Install environment
      ansible.builtin.template:
        src: templates/dockgate.env.j2
        dest: "{{ dockgate_config_dir }}/dockgate.env"
        owner: root
        group: "{{ dockgate_group }}"
        mode: "0640"
      notify: Restart dockgate

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/dockgate.service.j2
        dest: /etc/systemd/system/dockgate.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart dockgate

    - name: Apply service changes
      ansible.builtin.meta: flush_handlers

    - name: Enable and start dockgate
      ansible.builtin.systemd:
        name: dockgate
        enabled: true
        state: started

    - name: Verify readiness and running version
      ansible.builtin.uri:
        url: "http://{{ dockgate_listen | regex_replace('^0\\.0\\.0\\.0', '127.0.0.1') }}/version"
        return_content: true
      register: dockgate_version_check
      retries: 10
      delay: 2
      until: >-
        dockgate_version_check.status == 200 and
        dockgate_version_check.json.version == dockgate_git_version.stdout

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart dockgate
      ansible.builtin.systemd:
        name: dockgate
        state: restarted
