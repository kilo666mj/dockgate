---
# Committed defaults. This repository may be public: keep real hostnames,
# addresses and secrets in gitignored host_vars files or an Ansible Vault.
dockgate_user: dockgate
dockgate_group: dockgate
dockgate_data_dir: /var/lib/dockgate
dockgate_config_dir: /etc/dockgate
dockgate_binary: /usr/local/bin/dockgate
dockgate_listen: "127.0.0.1:8080"

# Built locally and copied to the host.
dockgate_goos: linux
dockgate_goarch: amd64
dockgate_go_toolchain: go1.27.1

# Agent API: mutual TLS, so expose it directly rather than through a
# TLS-terminating proxy. Agents must reach one of dockgate_agent_hosts.
dockgate_agent_listen: ":8443"
dockgate_agent_hosts: []          # set in host_vars, e.g. ["dockgate.example.net"]
dockgate_report_interval: "1m"

# Fleetglass export; leave the URL empty to disable. Put
# dockgate_fleetglass_token in group_vars/dockgate/secret.yml (Vault).
dockgate_fleetglass_url: ""
dockgate_fleetglass_token: ""
