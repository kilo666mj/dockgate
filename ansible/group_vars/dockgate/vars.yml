---
# Committed defaults. This repository may be public: keep real hostnames,
# addresses and secrets in gitignored host_vars files or an Ansible Vault.
dockgate_user: dockgate
dockgate_group: dockgate
dockgate_data_dir: /var/lib/dockgate
dockgate_config_dir: /etc/dockgate
dockgate_binary: /usr/local/bin/dockgate
dockgate_listen: "127.0.0.1:8080"

# Built locally and copied to the host.
dockgate_goos: linux
dockgate_goarch: amd64
dockgate_go_toolchain: go1.27.1

# Agent API: mutual TLS, so expose it directly rather than through a
# TLS-terminating proxy. Agents must reach one of dockgate_agent_hosts.
dockgate_agent_listen: ":8443"
dockgate_agent_hosts: []          # set in host_vars, e.g. ["dockgate.example.net"]
dockgate_report_interval: "1m"

# Fleetglass export; leave the URL empty to disable. Put
# dockgate_fleetglass_token in group_vars/dockgate/secret.yml (Vault).
dockgate_fleetglass_url: ""
dockgate_fleetglass_token: ""

# Vulnerability matching: the server runs a pinned Trivy binary against
# agents' SBOMs and keeps the vulnerability database under the data dir.
# Bump version and both checksums together (from the release's checksums.txt).
dockgate_trivy_version: "0.74.0"
dockgate_trivy_sha256:
  amd64: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  arm64: b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5
dockgate_trivy_dir: "/usr/local/lib/dockgate/trivy-{{ dockgate_trivy_version }}"
dockgate_db_refresh: "6h"

# Tintwire alerts for new fixable findings; leave the URL empty to disable.
# Put dockgate_tintwire_token in group_vars/dockgate/secret.yml (Vault).
dockgate_tintwire_url: ""
dockgate_tintwire_token: ""
# Empty publishes to the token's own channel, which hook tokens require.
dockgate_tintwire_channel: ""
dockgate_alert_severities: "CRITICAL,HIGH"

# MCP endpoint for agents, served on loopback behind an HTTPS proxy that
# admits only the Switchboard gateway. Empty disables it. The bearer token is
# generated on the host on first deploy; Switchboard copies it from there.
dockgate_mcp_listen: ""
dockgate_mcp_token_file: "{{ dockgate_config_dir }}/mcp.token"

# Taskboard: file one task per actionable container update for agents to
# pick up. Leave the URL empty to disable. Put dockgate_taskboard_token (a
# dedicated agent credential) in group_vars/dockgate/secret.yml (Vault).
dockgate_taskboard_url: ""
dockgate_taskboard_token: ""
dockgate_taskboard_max_open: 5
dockgate_taskboard_requirements: "runner:local"
# Image reference prefixes built from your own repositories.
dockgate_own_image_prefixes: []

# Web UI for approving update jobs, on loopback behind an HTTPS proxy.
# Empty disables it. It requires OIDC sign-in: register a client with
# redirect URL <dockgate_web_url>/auth/callback and put
# dockgate_oidc_client_secret in group_vars/dockgate/secret.yml (Vault).
# Allow at least one email or group.
dockgate_web_listen: ""
dockgate_web_url: ""
dockgate_oidc_issuer: ""
dockgate_oidc_client_id: ""
dockgate_oidc_client_secret: ""
dockgate_oidc_allowed_emails: []
dockgate_oidc_allowed_groups: []
